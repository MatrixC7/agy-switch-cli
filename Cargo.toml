[package]
name = "agy-switch-cli"
version = "1.1.0"
edition = "2021"
rust-version = "1.89"
license = "CC-BY-NC-SA-4.0"
description = "Headless multi-account manager and credential switcher for Antigravity CLI (agy)"

[features]
default = ["tui"]
tui = ["dep:crossterm", "dep:comfy-table", "dep:unicode-width", "dep:unicode-segmentation"]
# Optional backend gated behind explicit Cargo feature per Phase 0 Gate
# Note: rquest 5.1.0 / 5.2.0 are yanked on crates.io as verified in Phase 0;
# reqwest + rustls-tls-native-roots is the sole non-yanked TLS HTTP backend.
secret-service-backend = ["dep:secret-service"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal", "net", "io-util", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "socks"] }
secret-service = { version = "5.2", optional = true, features = ["rt-tokio-crypto-rust"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
url = "2.5"
uuid = { version = "1.10", features = ["v4", "serde"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
regex = "1.11"
thiserror = "2.0"
dirs = "5.0"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }

crossterm = { version = "0.29", optional = true }
comfy-table = { version = "7.1", optional = true }
unicode-width = { version = "0.2", optional = true }
unicode-segmentation = { version = "1.12", optional = true }

[dev-dependencies]
tempfile = "3.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
